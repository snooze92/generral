name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  backend:
    name: Backend (build, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore Generral.slnx

      - name: Build
        run: dotnet build Generral.slnx --no-restore -c Release

      - name: Check formatting
        run: dotnet format Generral.slnx --no-restore --verify-no-changes

      - name: Check migrations are up to date
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Generral.Core --no-build --configuration Release

      - name: Test
        run: dotnet test Generral.slnx --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:translations
      - run: pnpm build

      - name: Vendored Sonarr files are unmodified
        run: |
          revision=$(node -e "import('./scripts/sonarr-revision.mjs').then(m => console.log(m.SONARR_REVISION))")
          git init -q /tmp/sonarr
          git -C /tmp/sonarr fetch -q --depth 1 https://github.com/Sonarr/Sonarr.git "$revision"
          git -C /tmp/sonarr checkout -q FETCH_HEAD
          node scripts/vendor-sonarr.mjs /tmp/sonarr --check
          node scripts/update-reuse.mjs --check

  licensing:
    name: Licensing (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
