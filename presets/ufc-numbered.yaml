# Preset: UFC numbered events (UC1), one episode per event (the main card).
# Result in Plex:  UFC/Season 2027/UFC - S2027E02 - UFC 330 - Volkanovski vs. Lopes [WEBDL-1080p].mkv
schema: generral/preset@1
id: ufc-numbered
name: UFC – Numbered events
description: >
  Every numbered UFC event (UFC 330, 331, …) as one episode (the main card) in a year-based season,
  from TheSportsDB. The free API key returns at most 15 events per season, which misses some
  numbered events: use a premium key.
requires: { generral: ">=0.1" }
tags: [sport, mma, ufc]

parameters:
  - { name: tsdbKey, label: TheSportsDB API key, default: "123", secret: true }
  - { name: seasons, label: "Seasons (current, 2026 or 2025..current)", default: current }

source:
  name: TheSportsDB – UFC
  type: thesportsdb
  settings:
    apiKey: "{{ secret.tsdbKey }}"
    leagueId: "4443"
    seasons: "{{ seasons }}"
    includePast: true
    includeFuture: true
  refreshInterval: 12h

series:
  title: UFC
  overview: Numbered UFC pay-per-view events.
  network: UFC
  genres: [Sport, MMA]
  seasonFolder: true

mapping:
  name: UFC numbered events
  filter:
    - '{{ event.title | regex.match "^UFC \\d+\\b" }}'
    - '{{ event.status != "cancelled" }}'
  vars:
    number:   '{{ (event.title | regex.match "^UFC (\\d+)")[1] | string.to_int }}'
    headline: '{{ event.title | regex.replace "^UFC \\d+:?\\s*" "" }}'
  season:  { strategy: year }
  episode: { strategy: sequential, order: '{{ event.start }}', onInsert: renumber-unlocked }
  absolute: '{{ vars.number }}'
  title:    'UFC {{ vars.number }}{{ if vars.headline != "" }}: {{ vars.headline }}{{ end }}'
  overview: '{{ [event.fields.strVenue, event.fields.strCity, event.fields.strCountry] | array.compact | array.join ", " }}'
  airDate:  '{{ event.start }}'
  runtime:  180
  images:
    thumb: '{{ event.images.thumb ?? event.images.poster }}'
  search:
    categories: [5000, 5060]
    queries:
      - 'UFC {{ vars.number }}'
      - 'UFC{{ vars.number }}'
    must:
      - '\bUFC[ ._-]?{{ vars.number }}\b'
    mustNot:
      - '\bfight[ ._-]?night\b'
      - '\b(early[ ._-]?)?prelims?\b'
      - '\b(countdown|embedded|weigh[ ._-]?ins?|press[ ._-]?conference)\b'
    dateWindow: { before: 6h, after: 90d }
